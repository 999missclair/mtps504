<!doctype html><html><head><meta charset="utf-8"><title>probe</title>
<style>body{margin:0;font:13px system-ui}iframe{border:2px solid red;display:block}</style></head>
<body><iframe id="f" width="1024" height="768" src="about:blank"></iframe>
<pre id="out"></pre>
<script>
window.probe = function(url, w, h, zoom){
  return new Promise(res=>{
    const f=document.getElementById('f');
    f.width=w; f.height=h;
    f.onload=()=>{ setTimeout(()=>{
      const d=f.contentDocument, win=f.contentWindow;
      if (zoom) d.documentElement.style.fontSize = (16*zoom)+'px';
      setTimeout(()=>{
        const r={url,w,h,zoom:zoom||1,
          hScroll: d.documentElement.scrollWidth > win.innerWidth + 1,
          scrollW: d.documentElement.scrollWidth,
          docH: d.documentElement.scrollHeight,
          steps: (function(){
            const c=d.querySelector('.botnav__counter .count');
            return c?c.textContent.trim():'n/a';
          })()};
        res(r);
      }, 250);
    },400); };
    f.src=url;
  });
};
</script></body></html>
